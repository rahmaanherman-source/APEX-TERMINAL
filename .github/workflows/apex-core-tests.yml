name: APEX Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q tests/test_comparator.py
