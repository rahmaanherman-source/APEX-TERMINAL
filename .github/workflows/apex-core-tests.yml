name: APEX Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  comparator-and-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_integration_registry.py
      - run: pytest -q tests/test_comparator.py tests/test_integration_registry.py

  terminal-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build
