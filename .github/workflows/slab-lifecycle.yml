name: Slab Lifecycle Verification

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  slab-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:slab
